{{define "layout"}}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>{{.Title}} · Филин</title>
<link rel="icon" href="/static/icon-32.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4a2f19">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a href="/" class="brand"><img src="/static/icon-192.png" alt="" width="40" height="40">Филин</a>

  </nav>

<main>{{template "content" .}}</main>
<script>
// «назад» из карточки достаёт страницу из памяти браузера — с прежними обложками и данными
addEventListener('pageshow', e => { if (e.persisted) location.reload() })
</script>
</body>
</html>{{end}}
